<!-- Left Control Panel Container -->
<div id="left-panel" class="w-80 sm:w-96 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col h-full z-20 shadow-lg shrink-0">
    
    <!-- Data Sources Config Section -->
    <div class="p-2.5 border-b border-gray-200 dark:border-gray-700 shrink-0">
        <div class="flex justify-between items-center cursor-pointer select-none mb-1.5" id="toggle-database">
            <h3 class="font-bold text-[11px] uppercase tracking-wider text-gray-700 dark:text-gray-200 flex items-center space-x-1.5">
                <i class="fa-solid fa-database text-blue-600 dark:text-blue-400"></i>
                <span>Data Sources Config</span>
            </h3>
            <i class="fa-solid fa-chevron-down text-gray-400 text-[10px] transition-transform duration-200" id="icon-database"></i>
        </div>

        <div id="content-database" class="space-y-2">
            <div>
                <select id="saved-servers-select" class="w-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded px-2 py-1 text-xs focus:ring-1 focus:ring-blue-500 focus:outline-none">
                    <option value="" disabled selected>-- Load saved server --</option>
                </select>
            </div>

            <div class="flex space-x-1.5">
                <select id="server-type" class="w-1/3 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded px-1.5 py-1 text-xs focus:ring-1 focus:ring-blue-500 focus:outline-none font-medium">
                    <option value="ARCGIS">ESRI/REST</option>
                    <option value="WFS">WFS/OGC</option>
                    <option value="CKAN">CKAN Open Data</option>
                    <option value="OVERPASS">OSM</option>
                    <option value="LOCAL">Upload File</option>
                </select>
                
                <div id="server-url-container" class="flex-1 flex space-x-1">
                    <input type="text" id="server-url" placeholder="https://..." class="flex-1 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded px-2 py-1 text-xs focus:ring-1 focus:ring-blue-500 focus:outline-none min-w-0">
                    <button id="btn-save-server" class="bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 text-xs px-2 py-1 rounded font-medium transition-colors shadow-xs shrink-0" title="Save Server URL">
                        <i class="fa-solid fa-bookmark text-blue-600 dark:text-blue-400"></i>
                    </button>
                </div>

                <!-- Hidden Local File Upload Container -->
                <div id="local-upload-container" class="hidden flex-1 flex space-x-1">
                    <input type="file" id="local-file-input" accept=".geojson,.json,.kml,.csv,.zip" class="flex-1 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded py-0.5 text-xs focus:outline-none file:mr-2 file:py-1 file:px-2 file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 dark:file:bg-gray-600 dark:file:text-white cursor-pointer">
                </div>
            </div>

            <!-- Overpass OSM Builder -->
            <div id="overpass-builder" class="hidden flex-col space-y-2 bg-blue-50/40 dark:bg-gray-900/60 p-2 rounded border border-blue-200 dark:border-blue-900/50 text-xs">
                
                <!-- Dynamic Tag Builder -->
                <div class="border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-800 p-1.5 shadow-sm">
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wide mb-1">Tags (Key / Value)</label>
                    <div id="osm-tags-container" class="space-y-1">
                        <!-- Initial Row -->
                        <div class="flex items-center space-x-1 osm-tag-row">
                            <input type="text" class="osm-key flex-1 px-2 py-1 text-xs border border-gray-300 dark:border-gray-600 rounded bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-1 focus:ring-blue-500 focus:outline-none" placeholder="Key (e.g. amenity)" list="osm-keys">
                            <input type="text" class="osm-val flex-1 px-2 py-1 text-xs border border-gray-300 dark:border-gray-600 rounded bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-1 focus:ring-blue-500 focus:outline-none" placeholder="Value (e.g. cafe)" list="osm-values">
                            <button type="button" class="btn-add-tag bg-emerald-100 hover:bg-emerald-200 text-emerald-700 dark:bg-emerald-900/50 dark:hover:bg-emerald-800 dark:text-emerald-400 w-6 h-6 rounded flex items-center justify-center transition-colors shrink-0"><i class="fa-solid fa-plus text-[10px]"></i></button>
                            <button type="button" class="btn-remove-tag bg-red-100 hover:bg-red-200 text-red-700 dark:bg-red-900/50 dark:hover:bg-red-800 dark:text-red-400 w-6 h-6 rounded flex items-center justify-center transition-colors shrink-0 opacity-50 cursor-not-allowed" disabled><i class="fa-solid fa-minus text-[10px]"></i></button>
                        </div>
                        <datalist id="osm-keys"></datalist>
                        <datalist id="osm-values"></datalist>
                    </div>
                </div>

                <!-- Location & Geometry Filters -->
                <div class="flex space-x-1.5">
                     <input type="text" id="osm-location" placeholder="In Location (Optional)" class="flex-1 px-2 py-1 text-xs border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-1 focus:ring-blue-500 focus:outline-none min-w-0" title="Limit search to a geocoded city or region. Leave blank to search current map view.">
                     <select id="osm-geom" class="w-32 px-2 py-1 text-xs border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:ring-1 focus:ring-blue-500 focus:outline-none shrink-0 font-medium">
                        <option value="all" selected>All Geometries</option>
                        <option value="points">Points Only</option>
                        <option value="lines_polygons">Lines/Polygons</option>
                     </select>
                </div>

                <!-- Advanced Settings -->
                <details class="text-xs group border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-800 shadow-sm overflow-hidden">
                    <summary class="font-bold text-gray-600 dark:text-gray-300 cursor-pointer p-1.5 select-none flex items-center hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                        <i class="fa-solid fa-caret-right mr-2 transition-transform group-open:rotate-90 text-[10px] w-2 text-center"></i> Advanced Options
                    </summary>
                    <div class="p-2 border-t border-gray-200 dark:border-gray-700 space-y-2 bg-gray-50 dark:bg-gray-800/50">
                        <div class="flex items-center justify-between">
                            <label class="text-gray-600 dark:text-gray-400 font-medium">Timeout (Seconds)</label>
                            <input type="number" id="osm-timeout" value="25" min="5" max="300" class="w-14 px-1.5 py-0.5 text-xs border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-right focus:ring-1 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div class="flex items-center justify-between">
                            <label class="text-gray-600 dark:text-gray-400 font-medium flex items-center space-x-1" title="Allow the server to divide a large area into more chunks.">
                                <span>Grid Overload Limit</span>
                                <i class="fa-solid fa-circle-question text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 text-[10px] cursor-help"></i>
                            </label>
                            <input type="number" id="osm-max-chunks" value="16" min="1" max="250" class="w-14 px-1.5 py-0.5 text-xs border border-gray-300 dark:border-gray-600 rounded bg-white dark:bg-gray-700 text-gray-900 dark:text-white text-right focus:ring-1 focus:ring-blue-500 focus:outline-none">
                        </div>
                    </div>
                </details>

                <!-- INSPECT | FETCH OSM DATA -->
                <div class="flex space-x-1.5 pt-0.5">
                    <button id="btn-osm-inspect" type="button" class="w-1/3 bg-white hover:bg-gray-50 dark:bg-gray-800 dark:hover:bg-gray-700 text-blue-600 dark:text-blue-400 border border-gray-300 dark:border-gray-600 px-2 py-1.5 rounded text-xs font-semibold flex items-center justify-center space-x-1 transition-colors shadow-xs" title="Click and drag a box on the map to scan and inspect all OSM tags in that area.">
                        <i class="fa-solid fa-vector-square text-[11px]"></i>
                        <span>Inspect</span>
                    </button>
                    <button id="btn-fetch" class="btn-trigger-fetch flex-1 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-xs px-3 py-1.5 rounded shadow-xs transition-colors flex items-center justify-center space-x-1.5">
                        <i id="btn-fetch-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                        <span id="btn-fetch-text">Fetch OSM Data</span>
                    </button>
                </div>

                <!-- Inspect Area Results Drawer -->
                <div id="osm-inspect-container" class="hidden flex-col space-y-1 bg-blue-100/70 dark:bg-blue-950/80 p-2 rounded border border-blue-300 dark:border-blue-700 text-xs mt-1.5">
                    <div class="flex justify-between items-center border-b border-blue-200 dark:border-blue-800 pb-1">
                        <span class="font-bold text-blue-900 dark:text-blue-200 text-[10px] flex items-center space-x-1">
                            <i class="fa-solid fa-tags"></i>
                            <span>Inspected Area Tags</span>
                        </span>
                        <button id="btn-close-inspect" type="button" class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 text-xs px-1"><i class="fa-solid fa-times"></i></button>
                    </div>
                    <p id="osm-inspect-status" class="text-[10px] italic text-blue-800 dark:text-blue-300">Click and drag a box on the map...</p>
                    <div id="osm-inspect-results" class="max-h-32 overflow-y-auto custom-scroll space-y-0.5 pr-1"></div>
                </div>
            </div>

            <!-- Fetch Button for URL Server Sources (ArcGIS / WFS) -->
            <button id="btn-fetch-url" class="btn-trigger-fetch w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-xs py-1.5 rounded shadow-xs transition-colors flex items-center justify-center space-x-1.5">
                <i id="btn-fetch-spinner-url" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                <span id="btn-fetch-text-url">Fetch Layers</span>
            </button>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="flex shrink-0 bg-gray-100 dark:bg-gray-900/60 pt-1">
        <button id="tab-btn-available" class="flex-1 py-2 text-xs uppercase tracking-wider transition-all duration-200 font-bold bg-white dark:bg-gray-800 text-blue-600 dark:text-blue-400 border-t-[3px] border-t-blue-600 dark:border-t-blue-400 border-b border-b-transparent opacity-100 z-10">Available</button>
        <button id="tab-btn-added" class="flex-1 py-2 text-xs uppercase tracking-wider transition-all duration-200 font-medium bg-transparent text-gray-400 dark:text-gray-500 border-t-[3px] border-t-transparent border-b border-b-gray-200 dark:border-b-gray-700 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800/80 opacity-60 hover:opacity-100 shadow-inner cursor-pointer">Added (0)</button>
    </div>

    <!-- Main Layers List Container -->
    <div class="flex-1 overflow-hidden relative flex flex-col min-h-0">
        <!-- Tab 1: Available Layers -->
        <div id="tab-available" class="flex flex-col h-full p-2 min-h-0">
            <div id="search-container" class="relative mb-1.5 hidden shrink-0">
                <input type="text" id="layer-search" placeholder="Search available layers..." class="w-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded pl-7 pr-7 py-1 text-xs focus:ring-1 focus:ring-blue-500 focus:outline-none">
                <i class="fa-solid fa-magnifying-glass absolute left-2 top-1.5 text-gray-400 text-[10px]"></i>
                <button id="btn-clear-search" class="absolute right-2 top-1 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hidden text-xs"><i class="fa-solid fa-times"></i></button>
            </div>

            <div id="osm-available-tools" class="hidden flex-col space-y-1 mb-1.5 p-1.5 bg-blue-50/60 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 rounded shrink-0 text-xs">
                <span class="font-semibold text-blue-900 dark:text-blue-300 text-[10px]">Unpack OSM Data by Attribute:</span>
                <div class="flex space-x-1">
                    <select id="available-split-col" class="flex-1 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded px-1.5 py-0.5 text-xs">
                        <option value="" disabled selected>Select attribute...</option>
                    </select>
                    <button id="btn-available-split" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-2 py-0.5 rounded font-semibold transition-colors shadow-xs shrink-0">Unpack</button>
                </div>
            </div>

            <div id="available-layer-list" class="flex-1 overflow-y-auto custom-scroll pr-1 min-h-0">
                <p class="text-xs text-gray-400 dark:text-gray-500 italic text-center mt-3">No layers fetched yet.</p>
            </div>

            <div class="pt-1.5 border-t border-gray-200 dark:border-gray-700 shrink-0 mt-1">
                <button id="btn-add" disabled class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 disabled:bg-gray-300 dark:disabled:bg-gray-700 disabled:cursor-not-allowed text-white font-semibold text-xs py-1.5 rounded shadow-xs transition-colors flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-layer-group text-[11px]"></i>
                    <span>Add Selected Layers to Map</span>
                </button>
            </div>
        </div>

        <!-- Tab 2: Added Layers -->
        <div id="tab-added" class="hidden flex-col h-full p-2 min-h-0">
            <div id="added-search-container" class="relative mb-1.5 shrink-0 flex space-x-1">
                <div class="relative flex-1">
                    <input type="text" id="added-layer-search" placeholder="Filter active layers..." class="w-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded pl-7 pr-7 py-1 text-xs focus:ring-1 focus:ring-blue-500 focus:outline-none">
                    <i class="fa-solid fa-filter absolute left-2 top-1.5 text-gray-400 text-[10px]"></i>
                    <button id="btn-clear-added-search" class="absolute right-2 top-1 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hidden text-xs"><i class="fa-solid fa-times"></i></button>
                </div>
                <button id="btn-undo" class="bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 px-2 rounded border border-gray-300 dark:border-gray-600 shadow-xs transition-colors shrink-0 disabled:opacity-50 disabled:cursor-not-allowed" title="Undo Action" disabled>
                    <i class="fa-solid fa-rotate-left text-[11px]"></i>
                </button>
                <button id="btn-redo" class="bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 px-2 rounded border border-gray-300 dark:border-gray-600 shadow-xs transition-colors shrink-0 disabled:opacity-50 disabled:cursor-not-allowed" title="Redo Action" disabled>
                    <i class="fa-solid fa-rotate-right text-[11px]"></i>
                </button>
                <button id="btn-create-folder" class="bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 px-2 rounded border border-gray-300 dark:border-gray-600 shadow-xs transition-colors shrink-0" title="Create Folder Group">
                    <i class="fa-solid fa-folder-plus text-[11px]"></i>
                </button>
            </div>

            <div id="added-layer-list" class="flex-1 overflow-y-auto custom-scroll pr-1 min-h-0 pb-12">
                <p class="text-xs text-gray-400 dark:text-gray-500 italic text-center mt-3">No layers currently added to map.</p>
            </div>
        </div>
    </div>

    <!-- Context Panels Vertical Drag Resizer Bar -->
    <div id="context-resizer" class="hidden h-1.5 hover:h-2 bg-gray-200 dark:bg-gray-700 hover:bg-blue-500 cursor-row-resize transition-all shrink-0 z-30" title="Drag vertically to expand panel"></div>

    <!-- Bottom Context Submenu Panel (Edit / Split / Filter) -->
    <div id="context-panel-wrapper" class="hidden flex-col border-t border-gray-200 dark:border-gray-700 bg-gray-50/90 dark:bg-gray-900/80 shrink-0 h-auto min-h-[120px] max-h-[45vh] overflow-hidden">
              
        <!-- Edit Appearance Container -->
        <div id="edit-panel-container" class="hidden flex-col h-full min-h-0"></div>

        <!-- Split Layer Container -->
        <div id="split-panel-container" class="hidden flex-col h-full min-h-0"></div>

        <!-- Crop / Filter Container -->
        <div id="crop-panel-container" class="hidden flex-col p-2 text-xs space-y-2 h-full min-h-0 overflow-y-auto custom-scroll">
            <div class="flex justify-between items-center pb-1 border-b border-gray-200 dark:border-gray-700 shrink-0">
                <h4 class="font-bold text-gray-700 dark:text-gray-200 uppercase text-[11px] tracking-wider">Filter / Crop Layer</h4>
                <button onclick="window.closeSidebarPanels()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"><i class="fa-solid fa-times text-xs"></i></button>
            </div>

            <div class="space-y-1.5">
                <div>
                    <label class="block text-[11px] font-semibold text-gray-700 dark:text-gray-300 mb-0.5">Filter Type:</label>
                    <select id="filter-type" class="w-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded px-2 py-0.5 text-xs">
                        <option value="box">Bounding Box</option>
                        <option value="radius">Radius Circle</option>
                        <option value="data">Attribute Values</option>
                    </select>
                </div>

                <input type="number" id="filter-radius" placeholder="Radius (km)" value="5" class="hidden w-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded px-2 py-0.5 text-xs">

                <button id="btn-draw" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs py-1 rounded transition-colors shadow-xs">
                    <i class="fa-solid fa-pen-ruler mr-1 text-[10px]"></i> Draw Area on Map
                </button>

                <p id="draw-status" class="hidden text-[11px] italic text-blue-700 dark:text-blue-400 font-medium"></p>

                <div id="filter-data-container" class="hidden flex-col space-y-1.5">
                    <select id="filter-data-col" class="w-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded px-1.5 py-0.5 text-xs">
                        <option value="" disabled selected>Select attribute column...</option>
                    </select>

                    <div class="flex items-center justify-between">
                        <div class="relative flex-1 mr-1.5">
                            <input type="text" id="filter-data-search" placeholder="Search values..." class="w-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded pl-5 pr-5 py-0.5 text-xs">
                            <i class="fa-solid fa-magnifying-glass absolute left-1.5 top-1.5 text-gray-400 text-[9px]"></i>
                            <button id="btn-clear-filter-search" class="hidden absolute right-1.5 top-0.5 text-gray-400 hover:text-gray-600 text-xs"><i class="fa-solid fa-times"></i></button>
                        </div>
                        <button id="btn-filter-select-all" class="text-[9px] bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 px-1.5 py-0.5 rounded border border-gray-300 dark:border-gray-600 font-medium shrink-0">Toggle All</button>
                    </div>

                    <div id="filter-data-values" class="max-h-28 overflow-y-auto custom-scroll border border-gray-200 dark:border-gray-700 rounded p-1.5 bg-white dark:bg-gray-800 text-xs space-y-0.5"></div>
                </div>
            </div>

            <div class="pt-1.5 border-t border-gray-200 dark:border-gray-700 mt-1 shrink-0">
                <button id="btn-apply-filter" disabled class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 dark:disabled:bg-gray-700 disabled:cursor-not-allowed text-white font-semibold text-xs py-1 rounded transition-colors shadow-xs flex items-center justify-center space-x-1">
                    <i id="btn-filter-spinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                    <span id="btn-filter-text">Apply Filter</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Workspace Session Header & Controls -->
    <div class="p-2.5 border-t border-gray-200 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-900/40 shrink-0">
        <div class="flex justify-between items-center cursor-pointer select-none" id="toggle-workspace">
            <h3 class="font-bold text-[11px] uppercase tracking-wider text-gray-700 dark:text-gray-200 flex items-center space-x-1.5">
                <i class="fa-solid fa-briefcase text-blue-600 dark:text-blue-400"></i>
                <span>Workspace Session</span>
            </h3>
            <i class="fa-solid fa-chevron-down text-gray-400 text-[10px] transition-transform duration-200" id="icon-workspace"></i>
        </div>
        
        <div id="content-workspace" class="mt-2 space-y-1.5">
            <div class="flex items-center space-x-1.5">
                <button id="btn-export-workspace" class="flex-1 bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 text-xs py-1 rounded font-medium transition-colors shadow-xs flex items-center justify-center space-x-1" title="Export current workspace state to JSON">
                    <i class="fa-solid fa-download text-blue-600 dark:text-blue-400 text-[11px]"></i>
                    <span>Export</span>
                </button>
                <label id="lbl-import-workspace" class="flex-1 bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 text-xs py-1 rounded font-medium cursor-pointer transition-colors shadow-xs flex items-center justify-center space-x-1" title="Import workspace session JSON">
                    <i class="fa-solid fa-upload text-blue-600 dark:text-blue-400 text-[11px]"></i>
                    <span>Import</span>
                    <input type="file" id="file-import-workspace" accept=".json" class="hidden">
                </label>
                <button id="btn-clear-workspace" class="bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 text-xs px-2.5 py-1 rounded font-medium transition-colors shadow-xs flex items-center justify-center" title="Reset Workspace">
                    <i class="fa-solid fa-trash-can text-blue-600 dark:text-blue-400 text-[11px]"></i>
                </button>
            </div>
        </div>
    </div>

</div>
