<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIS Layer Previewer</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'media', // Natively listens to Chrome's Appearance settings
  }
</script>

<!-- System Theme Detector -->
<script>
  (() => {
    const savedTheme = localStorage.getItem('theme');
    const themeMedia = window.matchMedia('(prefers-color-scheme: dark)');
    
    // Check local storage first, fallback to system/browser setting
    if (savedTheme === 'dark' || (!savedTheme && themeMedia.matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  })();
</script>
