<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GIS Catalog Administration</title>
  <style>
    body { font: 14px system-ui,sans-serif; max-width: 1100px; margin: 2rem auto; padding: 0 1rem; color: #172033; }
    h1 { margin-bottom: .25rem; } .muted { color: #64748b; }
    section { border: 1px solid #d8dee9; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    table { width: 100%; border-collapse: collapse; } th,td { text-align: left; padding: .5rem; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
    input,select,button { padding: .45rem; border: 1px solid #cbd5e1; border-radius: 4px; } button { cursor: pointer; background:#eff6ff; }
    form { display:flex; gap:.5rem; flex-wrap:wrap; } form input { flex:1; min-width: 180px; }
    .healthy { color:#047857; } .error,.stale { color:#b91c1c; } .small { font-size:12px; }
  </style>
</head>
<body>
  <h1>GIS Catalog Administration</h1>
  <p class="muted">Sources are indexed here and searched by GIS Layer Previewer. Provider refreshes run outside map requests.</p>
  <section>
    <h2>Register source</h2>
    <form id="source-form">
      <input id="source-name" placeholder="Display name" required>
      <select id="source-type"><option>ARCGIS</option><option>WFS</option><option>CKAN</option></select>
      <input id="source-url" type="url" placeholder="https://..." required>
      <button>Register source</button>
    </form>
    <p id="message" class="muted"></p>
  </section>
  <section>
    <div style="display:flex;justify-content:space-between;align-items:center"><h2>Sources</h2><button id="refresh-all">Refresh all</button></div>
    <table><thead><tr><th>Source</th><th>Protocol</th><th>Status</th><th>Indexed</th><th>Last success</th><th>Actions</th></tr></thead><tbody id="sources"></tbody></table>
  </section>
  <section>
    <h2>Indexed layer inspection</h2>
    <form id="layer-search"><input id="layer-query" placeholder="Search indexed layers"><button>Search</button></form>
    <table><thead><tr><th>Layer</th><th>Provider</th><th>Coverage</th><th>Geometry</th><th>URL</th></tr></thead><tbody id="layers"></tbody></table>
  </section>
  <section><h2>Recent refresh history</h2><pre id="runs" class="small"></pre></section>
  <script>
    const $ = id => document.getElementById(id);
    const message = text => { $('message').textContent = text || ''; };
    async function api(path, options) { const response = await fetch(path, options); const data = await response.json(); if (!response.ok) throw new Error(data.error || response.statusText); return data; }
    function esc(value) { return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    async function loadSources() {
      const data = await api('/api/catalog/sources');
      $('sources').innerHTML = (data.sources || []).map(source => `<tr><td><strong>${esc(source.display_name)}</strong><div class="muted small">${esc(source.url)}</div></td><td>${esc(source.protocol)}</td><td class="${source.status === 'healthy' ? 'healthy' : source.stale ? 'stale' : ''}">${esc(source.status)}${source.error ? `<div class="small">${esc(source.error)}</div>` : ''}</td><td>${esc(source.indexed_layer_count)}</td><td>${esc(source.last_success_at || '—')}</td><td><button onclick="editSource('${esc(source.id)}')">Edit</button> <button onclick="refreshSource('${esc(source.id)}')">Refresh</button> <button onclick="removeSource('${esc(source.id)}')">Remove</button></td></tr>`).join('') || '<tr><td colspan="6">No sources registered.</td></tr>';
    }
    async function refreshSource(id) { message('Refreshing source…'); try { await api(`/api/catalog/sources/${encodeURIComponent(id)}/refresh`, {method:'POST'}); message('Refresh started.'); await loadSources(); } catch (error) { message(error.message); } }
    async function editSource(id) { try { const data = await api('/api/catalog/sources'); const source = (data.sources || []).find(item => item.id === id); if (!source) return; const name = prompt('Display name', source.display_name || source.name || ''); if (name === null) return; const url = prompt('Source URL', source.url || ''); if (url === null) return; await api(`/api/catalog/sources/${encodeURIComponent(id)}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({display_name:name, url})}); message('Source updated.'); await loadSources(); } catch(error) { message(error.message); } }
    async function removeSource(id) { if (!confirm('Remove this catalog source and its indexed layers?')) return; try { await api(`/api/catalog/sources/${encodeURIComponent(id)}`, {method:'DELETE'}); await loadSources(); } catch(error) { message(error.message); } }
    async function loadLayers(query='') { const data = await api(`/api/catalog/layers${query ? `?q=${encodeURIComponent(query)}` : ''}`); const rows = data.layers || []; $('layers').innerHTML = rows.map(layer => `<tr><td><strong>${esc(layer.title)}</strong><div class="muted small">${esc(layer.description || '')}</div></td><td>${esc(layer.provider)}</td><td>${esc(layer.coverage_status)} ${layer.bbox ? esc(JSON.stringify(layer.bbox)) : ''}</td><td>${esc(layer.geometryType || 'unknown')}</td><td><a href="${esc(layer.layerUrl || layer.url || '#')}" target="_blank">open</a></td></tr>`).join('') || '<tr><td colspan="5">No indexed layers.</td></tr>'; }
    async function loadRuns() { const data = await api('/api/catalog/refresh-runs'); $('runs').textContent = JSON.stringify(data, null, 2); }
    $('source-form').addEventListener('submit', async event => { event.preventDefault(); try { await api('/api/catalog/sources', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({display_name:$('source-name').value, type:$('source-type').value, url:$('source-url').value})}); message('Source registered.'); event.target.reset(); await loadSources(); } catch(error) { message(error.message); } });
    $('refresh-all').addEventListener('click', async () => { try { await api('/api/catalog/refresh', {method:'POST'}); message('Refresh started.'); } catch(error) { message(error.message); } });
    $('layer-search').addEventListener('submit', event => { event.preventDefault(); loadLayers($('layer-query').value); });
    loadSources(); loadLayers(); loadRuns();
  </script>
</body>
</html>
