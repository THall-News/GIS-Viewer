<!DOCTYPE html>
<!-- Force dark mode globally on the HTML tag -->
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIS Layer Previewer</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <!-- Esri Leaflet -->
  <script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js" crossorigin=""></script>
  <!-- Turf.js -->
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <!-- OSM to GeoJSON Converter -->
  <script src="https://unpkg.com/osmtogeojson@2.2.12/osmtogeojson.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    /* Custom Scrollbars - Base */
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    
    /* Custom Scrollbars - Dark */
    .dark .custom-scroll::-webkit-scrollbar-track { background: #374151; }
    .dark .custom-scroll::-webkit-scrollbar-thumb { background: #4B5563; border-radius: 4px; }
    .dark .custom-scroll::-webkit-scrollbar-thumb:hover { background: #6B7280; }
    
    /* Leaflet Popups - Dark */
    .dark .leaflet-popup-content-wrapper, .dark .leaflet-popup-tip {
      background-color: #1f2937 !important;
      color: #f3f4f6 !important;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5) !important;
    }
    .dark .leaflet-container a.leaflet-popup-close-button {
      color: #9ca3af !important;
    }
    .dark .leaflet-container a.leaflet-popup-close-button:hover {
      color: #f3f4f6 !important;
    }
    
    /* Leaflet Zoom Controls - Dark */
    .dark .leaflet-control-zoom a {
      background-color: #374151 !important;
      color: #d1d5db !important;
      border-color: #4b5563 !important;
    }
    .dark .leaflet-control-zoom a:hover {
      background-color: #4b5563 !important;
      color: #ffffff !important;
    }
    
    /* Leaflet Attribution - Dark */
    .dark .leaflet-control-attribution {
      background: rgba(31, 41, 55, 0.7) !important;
      color: #9ca3af !important;
    }
    .dark .leaflet-control-attribution a {
      color: #60a5fa !important;
    }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-sans overflow-hidden transition-colors duration-200">

  <div class="flex flex-col md:flex-row h-screen w-full">
    <!-- Left Control Panel -->
    <div class="w-full md:w-[38%] lg:w-[35%] xl:w-[30%] h-full bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col p-4 shadow-sm z-10 min-w-[380px] transition-colors duration-200">
      <h1 class="text-xl font-bold mb-3 text-slate-700 dark:text-slate-200 border-b border-gray-200 dark:border-gray-700 pb-2 shrink-0">GIS Layer Previewer</h1>
      
      <!-- Workspace Management Section -->
      <div class="mb-3 shrink-0 bg-slate-50 dark:bg-gray-800/80 p-2 rounded-md border border-gray-200 dark:border-gray-700 shadow-sm">
        <div class="flex justify-between items-center mb-2">
            <span class="text-[11px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider"><i class="fa-solid fa-floppy-disk mr-1"></i>Workspace Session</span>
            <button id="btn-clear-workspace" class="text-[10px] text-red-600 hover:text-red-800 dark:text-red-400 dark:hover:text-red-300 font-bold transition-colors" title="Clear active map layers">
                <i class="fa-solid fa-rotate-left mr-1"></i>Reset
            </button>
        </div>
        <div class="flex space-x-2">
            <button id="btn-export-workspace" class="flex-1 bg-indigo-100 hover:bg-indigo-200 dark:bg-indigo-900/40 dark:hover:bg-indigo-800 text-indigo-700 dark:text-indigo-300 font-bold py-1.5 px-2 rounded text-xs transition-colors shadow-sm flex items-center justify-center">
                <i class="fa-solid fa-download mr-1.5"></i> Export
            </button>
            <label id="btn-import-workspace-label" class="flex-1 bg-indigo-100 hover:bg-indigo-200 dark:bg-indigo-900/40 dark:hover:bg-indigo-800 text-indigo-700 dark:text-indigo-300 font-bold py-1.5 px-2 rounded text-xs transition-colors shadow-sm flex items-center justify-center cursor-pointer">
                <i class="fa-solid fa-upload mr-1.5"></i> Import
                <input type="file" id="file-import-workspace" accept=".json" class="hidden">
            </label>
        </div>
      </div>

      <!-- Server Database UI -->
      <div class="mb-3 shrink-0 bg-gray-50 dark:bg-gray-800/80 p-2 rounded-md border border-gray-200 dark:border-gray-700 transition-colors duration-200">
        <div class="flex justify-between items-center mb-2">
            <span class="text-[11px] font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider"><i class="fa-solid fa-database mr-1"></i>Server Database</span>
            <button id="btn-save-server" class="text-[10px] bg-blue-100 hover:bg-blue-200 dark:bg-blue-900/40 dark:hover:bg-blue-800 text-blue-700 dark:text-blue-300 font-bold py-1 px-2 rounded transition-colors shadow-sm flex items-center" title="Save URL below to database">
                <i class="fa-solid fa-plus mr-1"></i> Save Current
            </button>
        </div>
        <select id="saved-servers-select" class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded text-xs focus:outline-none focus:ring-1 focus:ring-blue-500 transition-colors duration-200">
            <option value="" disabled selected>-- Load saved server --</option>
        </select>
      </div>

      <!-- Server / Source Selection -->
      <div class="mb-3 shrink-0">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Source Type</label>
        <select id="server-type" class="w-full px-3 py-1.5 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition-colors duration-200">
          <option value="WFS">WFS (OGC)</option>
          <option value="ESRI">ESRI (MapServer / FeatureServer)</option>
          <option value="OVERPASS">OpenStreetMap (Overpass API)</option>
        </select>
      </div>

      <!-- URL Input for WFS / ESRI -->
      <div id="server-url-container" class="mb-3 shrink-0">
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Server URL</label>
        <input type="url" id="server-url" placeholder="https://example.com/geoserver/wfs" 
               class="w-full px-3 py-1.5 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm transition-colors duration-200">
      </div>

      <!-- Query Builder for OpenStreetMap -->
      <div id="overpass-builder" class="hidden shrink-0 mb-3 bg-indigo-50 dark:bg-gray-800/80 p-3 rounded-md border border-indigo-200 dark:border-indigo-800/50 shadow-inner">
        <div class="text-[11px] font-bold text-indigo-700 dark:text-indigo-400 mb-3 uppercase tracking-wider"><i class="fa-solid fa-map-location-dot mr-1"></i> OSM Data Query</div>
        
        <div class="flex space-x-2 mb-3">
          <div class="flex-1 relative">
            <label class="block text-[10px] font-bold text-gray-700 dark:text-gray-300 mb-1 flex items-center">
              Tag Key
              <span class="ml-1 text-gray-400 hover:text-indigo-500 cursor-help" title="Select a core category from the dropdown or type a custom one."><i class="fa-solid fa-circle-question"></i></span>
            </label>
            <input type="text" id="osm-key" list="osm-keys" placeholder="e.g. boundary" class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm">
            <datalist id="osm-keys">
              <option value="amenity"></option>
              <option value="boundary"></option>
              <option value="building"></option>
              <option value="highway"></option>
              <option value="landuse"></option>
              <option value="leisure"></option>
              <option value="natural"></option>
              <option value="place"></option>
              <option value="shop"></option>
              <option value="tourism"></option>
              <option value="waterway"></option>
            </datalist>
          </div>
          <div class="flex-1 relative">
            <label class="block text-[10px] font-bold text-gray-700 dark:text-gray-300 mb-1 flex items-center">
              Tag Value
              <span class="ml-1 text-gray-400 hover:text-indigo-500 cursor-help" title="Select a common type or type a custom one. (Leave blank to get ALL values)"><i class="fa-solid fa-circle-question"></i></span>
            </label>
            <input type="text" id="osm-value" list="osm-values" placeholder="e.g. administrative" class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm">
            <datalist id="osm-values">
              <!-- Dynamically populated by JS based on the Tag Key -->
              <option value="yes"></option>
              <option value="administrative"></option>
            </datalist>
          </div>
        </div>

        <div class="flex space-x-2 mb-3">
          <div class="flex-1 relative">
            <label class="block text-[10px] font-bold text-gray-700 dark:text-gray-300 mb-1 flex items-center">
              Feature Name
              <span class="ml-1 text-gray-400 hover:text-indigo-500 cursor-help" title="Optional: Only return shapes specifically named this."><i class="fa-solid fa-circle-question"></i></span>
            </label>
            <input type="text" id="osm-name" placeholder="e.g. High Park" class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm">
          </div>
          <div class="flex-1 relative">
            <label class="block text-[10px] font-bold text-gray-700 dark:text-gray-300 mb-1 flex items-center">
              Geometry
              <span class="ml-1 text-gray-400 hover:text-indigo-500 cursor-help" title="Filter the types of shapes you want returned."><i class="fa-solid fa-circle-question"></i></span>
            </label>
            <select id="osm-geom" class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm">
              <option value="lines_polygons">Lines & Polygons</option>
              <option value="points">Points Only</option>
              <option value="all">All Geometries</option>
            </select>
          </div>
        </div>

        <div class="relative">
          <label class="block text-[10px] font-bold text-gray-700 dark:text-gray-300 mb-1 flex items-center">
            Search Area
            <span class="ml-1 text-gray-400 hover:text-indigo-500 cursor-help" title="Optional: Type a city, state, or country (e.g. 'Halifax, Nova Scotia'). Leave blank to search your current Map View."><i class="fa-solid fa-circle-question"></i></span>
          </label>
          <input type="text" id="osm-location" placeholder="e.g. Halifax, Nova Scotia" class="w-full px-2 py-1.5 border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500 shadow-sm">
        </div>
      </div>

      <button id="btn-fetch" class="w-full bg-blue-600 hover:bg-blue-700 dark:bg-blue-600 dark:hover:bg-blue-500 text-white font-medium py-2 px-4 rounded-md transition-colors flex items-center justify-center mb-3 shadow-sm shrink-0">
        <span id="btn-fetch-text">Fetch Layers</span>
        <svg id="btn-fetch-spinner" class="animate-spin ml-2 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
      </button>

      <!-- Main Layer Management UI -->
      <div class="flex-1 overflow-hidden flex flex-col min-h-0 border border-gray-200 dark:border-gray-700 rounded-md bg-gray-50 dark:bg-gray-900/50 mb-3 shadow-inner transition-colors duration-200">
        <!-- Tabs -->
        <div class="flex border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 shrink-0 transition-colors duration-200">
          <button id="tab-btn-available" class="flex-1 py-2 text-xs font-semibold text-blue-600 dark:text-blue-400 border-b-2 border-blue-600 dark:border-blue-400 uppercase tracking-wider transition-colors">Available</button>
          <button id="tab-btn-added" class="flex-1 py-2 text-xs font-semibold text-gray-500 dark:text-gray-400 border-b-2 border-transparent hover:text-gray-700 dark:hover:text-gray-200 uppercase tracking-wider transition-colors">Added (0)</button>
        </div>
        
        <!-- Tab: Available -->
        <div id="tab-available" class="flex-1 flex flex-col overflow-hidden bg-white dark:bg-gray-800 min-h-0 transition-colors duration-200">
          
          <!-- OSM Available Tab Split Tools -->
          <div id="osm-available-tools" class="hidden p-2 border-b border-amber-200 dark:border-amber-900/50 bg-amber-50 dark:bg-amber-900/20 shrink-0 shadow-sm items-center justify-between transition-colors">
            <span class="text-[10px] font-bold text-amber-800 dark:text-amber-400 mr-2 shrink-0 uppercase tracking-wider"><i class="fa-solid fa-layer-group mr-1"></i>Split Data</span>
            <select id="available-split-col" class="flex-1 w-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-amber-500 shadow-sm transition-colors">
                <option value="" disabled selected>Select attribute...</option>
            </select>
            <button id="btn-available-split" class="ml-2 bg-amber-600 hover:bg-amber-700 text-white text-xs px-3 py-1 rounded transition-colors shadow-sm font-medium shrink-0">Split</button>
          </div>

          <div id="search-container" class="hidden p-2 border-b border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 shrink-0 shadow-sm">
            <div class="relative">
              <input type="text" id="layer-search" placeholder="Search available layers..." class="w-full pl-3 pr-8 py-1.5 text-sm border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 rounded focus:outline-none focus:ring-1 focus:ring-blue-500 transition-shadow">
              <button id="btn-clear-search" class="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 hidden transition-colors" title="Clear Search">
                <i class="fa-solid fa-times"></i>
              </button>
            </div>
          </div>
          <div id="available-layer-list" class="flex-1 overflow-y-auto custom-scroll p-2 min-h-0 space-y-1">
            <p class="text-sm text-gray-400 dark:text-gray-500 italic text-center mt-4">No layers fetched yet.</p>
          </div>
        </div>

        <!-- Tab: Added -->
        <div id="tab-added" class="flex-1 flex flex-col overflow-hidden hidden bg-white dark:bg-gray-800 relative min-h-0 transition-colors duration-200">
          
          <!-- Sticky Search Bar for Added Layers -->
          <div id="added-search-container" class="hidden p-2 border-b border-gray-100 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 shrink-0 shadow-sm">
            <div class="relative">
              <input type="text" id="added-layer-search" placeholder="Search added layers..." class="w-full pl-3 pr-8 py-1.5 text-sm border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 rounded focus:outline-none focus:ring-1 focus:ring-blue-500 transition-shadow">
              <button id="btn-clear-added-search" class="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 hidden transition-colors" title="Clear Search">
                <i class="fa-solid fa-times"></i>
              </button>
            </div>
          </div>

          <!-- Top: Layer List -->
          <div id="added-layer-list" class="flex-1 overflow-y-auto custom-scroll p-2 min-h-0">
            <p class="text-sm text-gray-400 dark:text-gray-500 italic text-center mt-4">No layers currently added to map.</p>
          </div>

          <!-- Middle: Attribute Table Panel -->
          <div id="attribute-table-container" class="hidden flex-col max-h-[60%] h-72 border-t border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 p-3 shrink-0 min-h-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] transition-colors duration-200"></div>

          <!-- Middle: Edit Panel -->
          <div id="edit-panel-container" class="hidden flex-col max-h-[70%] border-t border-gray-300 dark:border-gray-600 bg-purple-50 dark:bg-gray-800 shrink-0 min-h-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] transition-colors duration-200"></div>

          <!-- Middle: Split Panel -->
          <div id="split-panel-container" class="hidden flex-col max-h-[60%] border-t border-gray-300 dark:border-gray-600 bg-amber-50 dark:bg-gray-800 shrink-0 min-h-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] transition-colors duration-200"></div>

          <!-- Middle: Crop Filter Panel -->
          <div id="crop-panel-container" class="hidden flex-col max-h-[60%] border-t border-gray-300 dark:border-gray-600 bg-teal-50 dark:bg-gray-800 p-3 shrink-0 min-h-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] transition-colors duration-200">
            <div class="flex justify-between items-center mb-3 border-b border-teal-200 dark:border-teal-900/50 pb-2 shrink-0">
                <h3 class="text-xs font-bold text-gray-700 dark:text-gray-200 uppercase tracking-wider">Filter / Crop Layer</h3>
                <button onclick="window.closeAllPanels()" class="text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300"><i class="fa-solid fa-times"></i></button>
            </div>
            
            <div class="overflow-y-auto custom-scroll flex-1 pr-1 flex flex-col">
                <div class="flex space-x-2 mb-2 items-center shrink-0">
                  <select id="filter-type" class="flex-1 px-2 py-1 text-sm border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded">
                    <option value="box">Crop Box</option>
                    <option value="radius">Radius from Point</option>
                    <option value="data">Filter by Data</option>
                  </select>
                  <input type="number" id="filter-radius" value="5" placeholder="Km" class="w-20 px-2 py-1 text-sm border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded hidden">
                </div>

                <div id="filter-data-container" class="hidden flex-col mb-2 space-y-2 flex-1 min-h-0">
                    <select id="filter-data-col" class="w-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white rounded px-2 py-1 text-xs shrink-0">
                        <option value="" disabled selected>Select attribute column...</option>
                    </select>
                    
                    <div class="bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded p-1 flex-1 flex flex-col min-h-0">
                        <div class="flex justify-between items-center mb-1 px-1 border-b border-gray-200 dark:border-gray-600 pb-1 shrink-0">
                            <span class="text-[10px] font-bold text-gray-500 dark:text-gray-400 uppercase">Select Values</span>
                            <button id="btn-filter-select-all" class="text-[10px] text-teal-600 dark:text-teal-400 hover:text-teal-800 dark:hover:text-teal-300 font-bold transition-colors">Select All</button>
                        </div>
                        
                        <!-- Search Filter Input -->
                        <div class="px-1 pb-1 shrink-0">
                            <div class="relative">
                                <input type="text" id="filter-data-search" placeholder="Search values..." class="w-full pl-2 pr-6 py-1 text-xs border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 rounded focus:outline-none focus:ring-1 focus:ring-teal-500 transition-shadow">
                                <button id="btn-clear-filter-search" class="absolute right-1.5 top-1/2 transform -translate-y-1/2 text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 hidden transition-colors" title="Clear Search">
                                    <i class="fa-solid fa-times text-[10px]"></i>
                                </button>
                            </div>
                        </div>

                        <div id="filter-data-values" class="flex-1 overflow-y-auto custom-scroll text-xs p-1 min-h-0">
                            <p class="text-gray-400 dark:text-gray-500 italic text-center">Select a column first.</p>
                        </div>
                    </div>
                </div>

                <div class="flex space-x-2 mt-1 shrink-0 pt-2">
                  <button id="btn-draw" class="flex-1 bg-white dark:bg-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 text-sm font-medium py-1 rounded transition-colors border border-gray-300 dark:border-gray-600">Draw Region</button>
                  <button id="btn-apply-filter" disabled class="flex-1 bg-teal-600 hover:bg-teal-700 dark:bg-teal-700 dark:hover:bg-teal-600 disabled:bg-gray-400 dark:disabled:bg-gray-600 text-white text-sm font-medium py-1 rounded transition-colors flex justify-center items-center">
                    <span id="btn-filter-text">Apply</span>
                    <svg id="btn-filter-spinner" class="animate-spin ml-2 h-4 w-4 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                  </button>
                </div>
                <p id="draw-status" class="text-xs text-teal-700 dark:text-teal-400 mt-2 hidden font-medium text-center shrink-0">Click & drag on map to draw box.</p>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Bulk Add Button (Visible only on Available tab) -->
      <button id="btn-add" disabled class="w-full bg-emerald-600 hover:bg-emerald-700 dark:bg-emerald-700 dark:hover:bg-emerald-600 disabled:bg-gray-400 dark:disabled:bg-gray-600 disabled:cursor-not-allowed text-white font-medium py-2 px-4 rounded-md transition-colors shadow-sm shrink-0">
        Add Selected Layers to Map
      </button>

    </div>

    <!-- Right Map Panel -->
    <div class="w-full md:w-[62%] lg:w-[65%] xl:w-[70%] h-full relative">
      <div id="map" class="w-full h-full z-0"></div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-6 right-6 bg-gray-800 dark:bg-gray-700 text-white px-4 py-3 rounded shadow-xl transform transition-all duration-300 translate-y-20 opacity-0 z-50 flex items-center max-w-sm pointer-events-none">
    <span id="toast-message" class="text-sm break-words"></span>
  </div>

  <script>
    const map = L.map('map').setView([0, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    let fetchedLayers = [];
    let activeLayers = [];
    let previewLayers = {}; // Track temporary map preview layers
    let currentServerUrl = '';
    let currentServerType = '';
    
    // Variables for OSM feature splitting
    let lastFetchedOsmGeoJson = null;
    let lastFetchedOsmLayerName = '';
    
    // Panel Tracking
    let activeTableLayerKey = null; 
    let activeEditLayerKey = null;
    let activeSplitLayerKey = null;
    let activeCropLayerKey = null;
    
    // Edit Copy/Paste State
    let copiedStyle = null;

    // DOM Elements
    const tabBtnAvailable = document.getElementById('tab-btn-available');
    const tabBtnAdded = document.getElementById('tab-btn-added');
    const tabAvailable = document.getElementById('tab-available');
    const tabAdded = document.getElementById('tab-added');
    const btnAddBulk = document.getElementById('btn-add');
    
    const savedServersSelect = document.getElementById('saved-servers-select');
    const btnSaveServer = document.getElementById('btn-save-server');

    const searchContainer = document.getElementById('search-container');
    const layerSearch = document.getElementById('layer-search');
    const btnClearSearch = document.getElementById('btn-clear-search');
    const availableLayerList = document.getElementById('available-layer-list');
    
    const addedSearchContainer = document.getElementById('added-search-container');
    const addedLayerSearch = document.getElementById('added-layer-search');
    const btnClearAddedSearch = document.getElementById('btn-clear-added-search');
    const addedLayerList = document.getElementById('added-layer-list');
    
    const attributeTableContainer = document.getElementById('attribute-table-container');
    const editPanelContainer = document.getElementById('edit-panel-container');
    const splitPanelContainer = document.getElementById('split-panel-container');
    const cropPanelContainer = document.getElementById('crop-panel-container');
    
    const filterType = document.getElementById('filter-type');
    const filterRadius = document.getElementById('filter-radius');
    const btnDraw = document.getElementById('btn-draw');
    const btnApplyFilter = document.getElementById('btn-apply-filter');
    const drawStatus = document.getElementById('draw-status');
    const filterDataContainer = document.getElementById('filter-data-container');
    const filterDataCol = document.getElementById('filter-data-col');
    const filterDataValues = document.getElementById('filter-data-values');
    const filterDataSearch = document.getElementById('filter-data-search');
    const btnClearFilterSearch = document.getElementById('btn-clear-filter-search');
    const toast = document.getElementById('toast');

    let drawingMode = null; 
    let drawStart = null;
    let tempShape = null; 
    let filterGeometryData = null; 
    const drawLayerGroup = L.featureGroup().addTo(map);

    // --- Helper Functions ---
    const showToast = (msg, isError=false) => {
      toast.className = `fixed bottom-6 right-6 px-4 py-3 rounded shadow-xl transform transition-all duration-300 z-50 max-w-sm ${isError ? 'bg-red-600 text-white' : 'bg-gray-800 dark:bg-gray-700 text-white'}`;
      document.getElementById('toast-message').textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 5000);
    };

    const darkenHex = (hex, percent = 0.3) => {
        hex = hex.replace('#', '');
        if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
        let r = parseInt(hex.substring(0, 2), 16);
        let g = parseInt(hex.substring(2, 4), 16);
        let b = parseInt(hex.substring(4, 6), 16);
        r = Math.max(0, Math.floor(r * (1 - percent)));
        g = Math.max(0, Math.floor(g * (1 - percent)));
        b = Math.max(0, Math.floor(b * (1 - percent)));
        return '#' + r.toString(16).padStart(2, '0') + g.toString(16).padStart(2, '0') + b.toString(16).padStart(2, '0');
    };

    const updateMapLayerOrder = () => {
        // Process layers from bottom of the UI list to the top.
        // This ensures the top item in the UI is rendered last (visually on top).
        for (let i = activeLayers.length - 1; i >= 0; i--) {
            const layer = activeLayers[i];
            if (!layer.isVisible) continue;
            
            const z = 1000 - i;
            
            // 1. Raster Tile Layers (WFS, Esri MapServer)
            if (typeof layer.mapLayer.setZIndex === 'function') {
                layer.mapLayer.setZIndex(z);
            }
            
            // 2. Primary Vector Layer Container
            if (typeof layer.mapLayer.bringToFront === 'function') {
                layer.mapLayer.bringToFront();
            }
            
            // 3. Drill down into FeatureGroups to explicitly reorder nested paths and HTML Markers
            if (typeof layer.mapLayer.eachLayer === 'function') {
                layer.mapLayer.eachLayer(child => {
                    // Force SVG paths (polygons, lines, circleMarkers) to the front
                    if (typeof child.bringToFront === 'function') {
                        child.bringToFront();
                    }
                    // Force DOM markers (custom squares/triangles) to use accurate CSS z-indexing
                    if (typeof child.setZIndexOffset === 'function') {
                        child.setZIndexOffset(z);
                    }
                });
            }
        }
        autoSaveWorkspace(); 
    };
    
    const clearAllPreviews = () => {
        Object.values(previewLayers).forEach(layer => map.removeLayer(layer));
        previewLayers = {};
    };

    // --- Map Preview Toggle Logic ---
    const togglePreviewLayer = (layerId, isVisible) => {
        if (!isVisible) {
            if (previewLayers[layerId]) {
                map.removeLayer(previewLayers[layerId]);
                delete previewLayers[layerId];
            }
            return;
        }

        const meta = fetchedLayers.find(l => l.id === layerId);
        if(!meta) return;

        let mapLayer;

        if (meta.geoJsonData) {
            const customStyle = { type: 'single', fillColor: '#10b981', fillOpacity: 0.5, color: '#059669', opacity: 1.0, pointShape: 'circle', pointSize: 8 };
            mapLayer = L.geoJSON(meta.geoJsonData, {
                style: createGeoJsonStyleFunction(customStyle),
                pointToLayer: createGeoJsonPointToLayer(customStyle),
                onEachFeature: attachPopupsToFeatures
            });
        } else {
            const baseUrl = currentServerUrl.split('?')[0];
            if (currentServerType === 'WFS') {
                mapLayer = L.tileLayer.wms(baseUrl, { layers: meta.id, format: 'image/png', transparent: true });
            } else {
                if (!baseUrl.toLowerCase().includes('featureserver')) {
                    mapLayer = L.esri.dynamicMapLayer({ url: baseUrl, layers: [meta.id], opacity: 0.8 });
                } else {
                    const fUrl = baseUrl.endsWith(`/${meta.id}`) ? baseUrl : `${baseUrl}/${meta.id}`;
                    mapLayer = L.esri.featureLayer({ url: fUrl });
                }
            }
        }
        
        mapLayer.addTo(map);
        previewLayers[layerId] = mapLayer;
    };

    // --- WORKSPACE PERSISTENCE LOGIC ---
    const serializeWorkspace = () => {
        const center = map.getCenter();
        const zoom = map.getZoom();

        const layersData = activeLayers.map(l => ({
            uniqueKey: l.uniqueKey,
            id: l.id,
            displayName: l.displayName,
            exportUrl: l.exportUrl,
            isLocalGeoJSON: l.isLocalGeoJSON,
            geoJsonData: l.geoJsonData,
            customStyle: l.customStyle,
            isVisible: l.isVisible
        }));

        return {
            version: "1.0",
            savedAt: new Date().toISOString(),
            mapState: { lat: center.lat, lng: center.lng, zoom },
            activeLayers: layersData
        };
    };

    const autoSaveWorkspace = () => {
        try {
            const data = serializeWorkspace();
            localStorage.setItem('gis_previewer_auto_save', JSON.stringify(data));
        } catch (e) {
            console.warn("Auto-save failed: Storage limit may be reached.", e);
        }
    };

    const restoreWorkspaceState = (data) => {
        closeAllPanels();
        clearAllPreviews();

        // Clear currently loaded active map layers
        activeLayers.forEach(l => {
            if (l.mapLayer) map.removeLayer(l.mapLayer);
        });
        activeLayers = [];

        // Restore map view
        if (data.mapState && data.mapState.lat !== undefined) {
            map.setView([data.mapState.lat, data.mapState.lng], data.mapState.zoom || 10);
        }

        // Reconstruct active layers
        if (data.activeLayers && Array.isArray(data.activeLayers)) {
            data.activeLayers.forEach(lData => {
                let mapLayer;
                
                if (lData.isLocalGeoJSON && lData.geoJsonData) {
                    mapLayer = L.geoJSON(lData.geoJsonData, {
                        style: createGeoJsonStyleFunction(lData.customStyle),
                        pointToLayer: createGeoJsonPointToLayer(lData.customStyle),
                        onEachFeature: attachPopupsToFeatures
                    });
                } else if (lData.exportUrl) {
                    const baseUrl = lData.exportUrl.split('?')[0];
                    if (lData.exportUrl.includes('WFS')) {
                        mapLayer = L.tileLayer.wms(baseUrl, { layers: lData.id, format: 'image/png', transparent: true });
                    } else if (lData.exportUrl.includes('featureserver')) {
                        mapLayer = L.esri.featureLayer({ url: baseUrl });
                    } else {
                        mapLayer = L.esri.dynamicMapLayer({ url: baseUrl, layers: [lData.id], opacity: 0.8 });
                    }
                }

                if (mapLayer) {
                    if (lData.isVisible) mapLayer.addTo(map);
                    
                    activeLayers.push({
                        uniqueKey: lData.uniqueKey || Math.random().toString(36).substr(2,9),
                        id: lData.id,
                        displayName: lData.displayName,
                        mapLayer: mapLayer,
                        exportUrl: lData.exportUrl,
                        isLocalGeoJSON: lData.isLocalGeoJSON,
                        geoJsonData: lData.geoJsonData,
                        customStyle: lData.customStyle,
                        isVisible: lData.isVisible ?? true
                    });
                }
            });
        }

        renderAddedLayers();
        updateMapLayerOrder();
    };

    // Export Workspace File
    document.getElementById('btn-export-workspace').addEventListener('click', () => {
        if (activeLayers.length === 0) return showToast("No active layers to export in workspace.", true);
        const data = serializeWorkspace();
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const dateStr = new Date().toISOString().split('T')[0];
        downloadBlob(blob, `gis_workspace_${dateStr}`);
    });

    // Import Workspace File
    document.getElementById('file-import-workspace').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
            try {
                const data = JSON.parse(evt.target.result);
                if (!data.activeLayers || !data.mapState) throw new Error("Invalid workspace file format.");
                
                restoreWorkspaceState(data);
                switchTab('added');
                showToast("Workspace restored successfully!");
            } catch (err) {
                console.error(err);
                showToast("Failed to parse workspace JSON file.", true);
            } finally {
                e.target.value = ''; // Reset input
            }
        };
        reader.readAsText(file);
    });

    // Reset / Clear Workspace
    document.getElementById('btn-clear-workspace').addEventListener('click', () => {
        if (activeLayers.length === 0) return;
        if (confirm("Reset workspace? All added layers will be removed from the map.")) {
            closeAllPanels();
            clearAllPreviews();
            activeLayers.forEach(l => map.removeLayer(l.mapLayer));
            activeLayers = [];
            localStorage.removeItem('gis_previewer_auto_save');
            renderAddedLayers();
            showToast("Workspace reset.");
        }
    });

    // --- UI Toggles ---
    document.getElementById('server-type').addEventListener('change', (e) => {
        const type = e.target.value;
        if (type === 'OVERPASS') {
            document.getElementById('server-url-container').classList.add('hidden');
            document.getElementById('overpass-builder').classList.remove('hidden');
            document.getElementById('btn-fetch-text').textContent = 'Fetch OSM Data';
            document.getElementById('btn-save-server').disabled = true;
            document.getElementById('btn-save-server').classList.add('opacity-50');
        } else {
            document.getElementById('server-url-container').classList.remove('hidden');
            document.getElementById('overpass-builder').classList.add('hidden');
            document.getElementById('btn-fetch-text').textContent = 'Fetch Layers';
            document.getElementById('btn-save-server').disabled = false;
            document.getElementById('btn-save-server').classList.remove('opacity-50');
            
            // Hide OSM-specific tools when switching away from Overpass
            document.getElementById('osm-available-tools').classList.add('hidden');
            document.getElementById('osm-available-tools').classList.remove('flex');
        }
    });

    const loadSavedServers = async () => {
        try {
            const res = await fetch('/api/servers');
            const servers = await res.json();
            
            savedServersSelect.innerHTML = '<option value="" disabled selected>-- Load saved server --</option>';
            servers.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.url;
                opt.textContent = s.name;
                opt.dataset.type = s.type;
                savedServersSelect.appendChild(opt);
            });
        } catch (err) {
            console.error("Failed to load servers", err);
        }
    };

    savedServersSelect.addEventListener('change', (e) => {
        const opt = e.target.options[e.target.selectedIndex];
        if (opt.value) {
            document.getElementById('server-url').value = opt.value;
            const sType = document.getElementById('server-type');
            sType.value = opt.dataset.type;
            sType.dispatchEvent(new Event('change')); // Trigger the UI toggle
        }
    });

    btnSaveServer.addEventListener('click', async () => {
        const url = document.getElementById('server-url').value.trim();
        const type = document.getElementById('server-type').value;
        if (!url) return showToast("Enter a Server URL to save.", true);
        
        const name = prompt("Enter a recognizable name for this server database:");
        if (!name) return;

        try {
            const res = await fetch('/api/servers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, url, type })
            });
            if (res.ok) {
                showToast("Server added to Database!");
                await loadSavedServers();
                savedServersSelect.value = url;
            }
        } catch (err) {
            showToast("Failed to save server.", true);
        }
    });

    const switchTab = (tabName) => {
      if (tabName === 'available') {
        tabBtnAvailable.classList.replace('text-gray-500', 'text-blue-600');
        tabBtnAvailable.classList.replace('dark:text-gray-400', 'dark:text-blue-400');
        tabBtnAvailable.classList.replace('border-transparent', 'border-blue-600');
        tabBtnAvailable.classList.replace('dark:border-transparent', 'dark:border-blue-400');
        
        tabBtnAdded.classList.replace('text-blue-600', 'text-gray-500');
        tabBtnAdded.classList.replace('dark:text-blue-400', 'dark:text-gray-400');
        tabBtnAdded.classList.replace('border-blue-600', 'border-transparent');
        tabBtnAdded.classList.replace('dark:border-blue-400', 'dark:border-transparent');
        
        tabAvailable.classList.replace('hidden', 'flex');
        tabAdded.classList.replace('flex', 'hidden');
        btnAddBulk.classList.remove('hidden');
      } else {
        tabBtnAdded.classList.replace('text-gray-500', 'text-blue-600');
        tabBtnAdded.classList.replace('dark:text-gray-400', 'dark:text-blue-400');
        tabBtnAdded.classList.replace('border-transparent', 'border-blue-600');
        tabBtnAdded.classList.replace('dark:border-transparent', 'dark:border-blue-400');
        
        tabBtnAvailable.classList.replace('text-blue-600', 'text-gray-500');
        tabBtnAvailable.classList.replace('dark:text-blue-400', 'dark:text-gray-400');
        tabBtnAvailable.classList.replace('border-blue-600', 'border-transparent');
        tabBtnAvailable.classList.replace('dark:border-blue-400', 'dark:border-transparent');
        
        tabAdded.classList.replace('hidden', 'flex');
        tabAvailable.classList.replace('flex', 'hidden');
        btnAddBulk.classList.add('hidden');
      }
    };

    tabBtnAvailable.addEventListener('click', () => switchTab('available'));
    tabBtnAdded.addEventListener('click', () => switchTab('added'));

    const closeAllPanels = () => {
        activeTableLayerKey = null;
        activeEditLayerKey = null;
        activeSplitLayerKey = null;
        activeCropLayerKey = null;
        
        attributeTableContainer.classList.add('hidden');
        attributeTableContainer.classList.remove('flex');
        editPanelContainer.classList.add('hidden');
        editPanelContainer.classList.remove('flex');
        splitPanelContainer.classList.add('hidden');
        splitPanelContainer.classList.remove('flex');
        cropPanelContainer.classList.add('hidden');
        cropPanelContainer.classList.remove('flex');
        
        filterType.value = 'box';
        filterRadius.classList.add('hidden');
        filterDataContainer.classList.add('hidden');
        btnDraw.classList.remove('hidden');

        drawLayerGroup.clearLayers();
        filterGeometryData = null;
        drawingMode = null;
        btnApplyFilter.disabled = true;
        drawStatus.classList.add('hidden');
        map.getContainer().style.cursor = '';
        renderAddedLayers();
    };
    window.closeAllPanels = closeAllPanels;

    const triggerSearch = () => {
      const term = layerSearch.value.toLowerCase();
      if (term === '') {
        btnClearSearch.classList.add('hidden');
      } else {
        btnClearSearch.classList.remove('hidden');
      }
      let visibleCount = 0;
      document.querySelectorAll('.available-layer-item').forEach(item => {
        if (item.getAttribute('data-search').includes(term)) {
          item.classList.remove('hidden');
          visibleCount++;
        } else {
          item.classList.add('hidden');
        }
      });
      let emptyMsg = document.getElementById('search-empty-msg');
      if (visibleCount === 0 && fetchedLayers.length > 0) {
        if (!emptyMsg) {
          emptyMsg = document.createElement('p');
          emptyMsg.id = 'search-empty-msg';
          emptyMsg.className = 'text-sm text-gray-400 dark:text-gray-500 italic text-center mt-4';
          emptyMsg.textContent = 'No matching layers found.';
          availableLayerList.appendChild(emptyMsg);
        }
        emptyMsg.classList.remove('hidden');
      } else if (emptyMsg) {
        emptyMsg.classList.add('hidden');
      }
    };

    layerSearch.addEventListener('input', triggerSearch);
    btnClearSearch.addEventListener('click', () => {
      layerSearch.value = '';
      triggerSearch();
      layerSearch.focus();
    });

    const triggerAddedSearch = () => {
      const term = addedLayerSearch.value.toLowerCase();
      if (term === '') {
        btnClearAddedSearch.classList.add('hidden');
      } else {
        btnClearAddedSearch.classList.remove('hidden');
      }
      let visibleCount = 0;
      document.querySelectorAll('.added-layer-item').forEach(item => {
        if (item.getAttribute('data-search').includes(term)) {
          item.classList.remove('hidden');
          visibleCount++;
        } else {
          item.classList.add('hidden');
        }
      });
      let emptyMsg = document.getElementById('added-search-empty-msg');
      if (visibleCount === 0 && activeLayers.length > 0) {
        if (!emptyMsg) {
          emptyMsg = document.createElement('p');
          emptyMsg.id = 'added-search-empty-msg';
          emptyMsg.className = 'text-sm text-gray-400 dark:text-gray-500 italic text-center mt-4';
          emptyMsg.textContent = 'No matching layers found.';
          addedLayerList.appendChild(emptyMsg);
        }
        emptyMsg.classList.remove('hidden');
      } else if (emptyMsg) {
        emptyMsg.classList.add('hidden');
      }
    };

    addedLayerSearch.addEventListener('input', triggerAddedSearch);
    btnClearAddedSearch.addEventListener('click', () => {
      addedLayerSearch.value = '';
      triggerAddedSearch();
      addedLayerSearch.focus();
    });

    // --- Filter Values Search Logic ---
    const triggerFilterDataSearch = () => {
        const term = filterDataSearch.value.toLowerCase();
        if (term === '') {
            btnClearFilterSearch.classList.add('hidden');
        } else {
            btnClearFilterSearch.classList.remove('hidden');
        }
        
        document.querySelectorAll('#filter-data-values label').forEach(label => {
            const val = label.querySelector('input').value.toLowerCase();
            if (val.includes(term)) {
                label.classList.remove('hidden');
                label.classList.add('flex'); 
            } else {
                label.classList.add('hidden');
                label.classList.remove('flex');
            }
        });
    };

    filterDataSearch.addEventListener('input', triggerFilterDataSearch);
    btnClearFilterSearch.addEventListener('click', () => {
        filterDataSearch.value = '';
        triggerFilterDataSearch();
        filterDataSearch.focus();
    });

    // --- Available Tab Split Tool Logic ---
    document.getElementById('btn-available-split').addEventListener('click', () => {
        const splitCol = document.getElementById('available-split-col').value;
        if(!splitCol) return showToast("Select an attribute column first.", true);
        if(!lastFetchedOsmGeoJson) return;
        
        const uniqueVals = [...new Set(lastFetchedOsmGeoJson.features.map(f => f.properties[splitCol]))];
        if (uniqueVals.length > 50 && !confirm(`This will unpack ${uniqueVals.length} layers into the list below. Proceed?`)) return;
        
        clearAllPreviews(); // Clear original un-split preview from map
        fetchedLayers = []; 
        
        uniqueVals.forEach(val => {
            const filteredFeats = lastFetchedOsmGeoJson.features.filter(f => f.properties[splitCol] === val);
            if(filteredFeats.length === 0) return;
            
            const displayVal = (val === null || val === undefined || val === '') ? 'null' : val;
            
            // Auto-append feature 'name' if this split bucket isolates exactly 1 named feature
            let extraName = '';
            if (filteredFeats.length === 1 && filteredFeats[0].properties.name && splitCol !== 'name') {
                extraName = ` - ${filteredFeats[0].properties.name}`;
            }
            
            fetchedLayers.push({
                id: `osm_${Date.now()}_${Math.random().toString(36).substr(2,5)}`,
                title: `${lastFetchedOsmLayerName} [${splitCol}: ${displayVal}]${extraName}`,
                geoJsonData: { type: "FeatureCollection", features: filteredFeats }
            });
        });
        
        renderAvailableLayers();
        showToast(`Successfully unpacked into ${fetchedLayers.length} sub-layers!`);
    });

    const addLayerToMap = (layerId, switchTabAfter = true) => {
        const meta = fetchedLayers.find(l => l.id === layerId);
        if(!meta) return;

        let mapLayer, exportUrl = null, isLocalGeoJSON = false, geoJsonData = null, customStyle = null;

        // Clean up temporary preview map layer before officially adding
        if (previewLayers[layerId]) {
            map.removeLayer(previewLayers[layerId]);
            delete previewLayers[layerId];
        }

        // If the layer is pure GeoJSON (like OSM Data)
        if (meta.geoJsonData) {
            isLocalGeoJSON = true;
            geoJsonData = meta.geoJsonData;
            customStyle = { type: 'single', fillColor: '#10b981', fillOpacity: 0.5, color: '#059669', opacity: 1.0, pointShape: 'circle', pointSize: 8 };
            
            mapLayer = L.geoJSON(geoJsonData, {
                style: createGeoJsonStyleFunction(customStyle),
                pointToLayer: createGeoJsonPointToLayer(customStyle),
                onEachFeature: attachPopupsToFeatures
            });
        } 
        // If the layer is an external server (WFS / ESRI)
        else {
            const baseUrl = currentServerUrl.split('?')[0];
            if (currentServerType === 'WFS') {
              mapLayer = L.tileLayer.wms(baseUrl, { layers: meta.id, format: 'image/png', transparent: true });
              exportUrl = `${baseUrl}?service=WFS&version=1.1.0&request=GetFeature&typeName=${encodeURIComponent(meta.id)}&outputFormat=application%2Fjson&srsName=EPSG:4326`;
            } else {
              if (!baseUrl.toLowerCase().includes('featureserver')) {
                mapLayer = L.esri.dynamicMapLayer({ url: baseUrl, layers: [meta.id], opacity: 0.8 });
                exportUrl = `${baseUrl}/${meta.id}/query?where=1=1&outFields=*&f=geojson&outSR=4326`;
              } else {
                const fUrl = baseUrl.endsWith(`/${meta.id}`) ? baseUrl : `${baseUrl}/${meta.id}`;
                mapLayer = L.esri.featureLayer({ url: fUrl });
                exportUrl = `${fUrl}/query?where=1=1&outFields=*&f=geojson&outSR=4326`;
              }
            }
        }
        
        mapLayer.addTo(map);
        
        activeLayers.unshift({ 
          uniqueKey: Math.random().toString(36).substr(2,9), 
          id: meta.id, 
          displayName: meta.title, 
          mapLayer, 
          exportUrl, 
          isLocalGeoJSON,
          geoJsonData,
          customStyle,
          isVisible: true 
        });
        
        updateMapLayerOrder();
        
        if (switchTabAfter) {
            renderAddedLayers();
            switchTab('added');
            showToast(`Added ${meta.title} to map!`);
        }
    };

    const renderAvailableLayers = () => {
      availableLayerList.innerHTML = '';
      if (fetchedLayers.length === 0) {
        availableLayerList.innerHTML = `<p class="text-sm text-gray-400 dark:text-gray-500 italic text-center mt-4">No layers fetched yet.</p>`;
        searchContainer.classList.add('hidden');
        btnAddBulk.disabled = true;
        return;
      }
      
      searchContainer.classList.remove('hidden');
      btnAddBulk.disabled = false;

      fetchedLayers.forEach((layer) => {
        const div = document.createElement('div');
        div.className = 'available-layer-item flex items-center p-2 hover:bg-gray-50 dark:hover:bg-gray-700 rounded border border-transparent dark:border-transparent hover:border-gray-200 dark:hover:border-gray-600 mb-1 transition-colors';
        div.setAttribute('data-search', `${layer.title} ${layer.id}`.toLowerCase());
        
        div.innerHTML = `
          <div class="flex items-center h-5 mr-2 shrink-0">
             <input id="cb-${layer.id}" type="checkbox" value="${layer.id}" class="w-4 h-4 layer-checkbox cursor-pointer accent-blue-600 dark:accent-blue-500" title="Preview on Map">
          </div>
          <div class="ml-1 text-sm flex-1 overflow-hidden pr-2 cursor-pointer">
            <label for="cb-${layer.id}" class="font-medium text-gray-700 dark:text-gray-200 block truncate cursor-pointer" title="${layer.title}">${layer.title}</label>
            <p class="text-gray-400 dark:text-gray-500 text-[10px] truncate" title="${layer.id}">ID: ${layer.id}</p>
          </div>
          <button class="btn-add-single shrink-0 bg-blue-100 dark:bg-blue-900/40 hover:bg-blue-200 dark:hover:bg-blue-800 text-blue-700 dark:text-blue-300 w-8 h-8 rounded-full flex items-center justify-center transition-colors shadow-sm" data-id="${layer.id}" title="Add Single Layer">
