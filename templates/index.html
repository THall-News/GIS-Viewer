<!DOCTYPE html>
<html lang="en">
<head>
  {% include 'components/head.html' %}
  <!-- Pickr Color Picker (Nano Theme) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/themes/nano.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr/dist/pickr.min.js"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-sans overflow-hidden transition-colors duration-200">

  <div class="flex flex-col md:flex-row h-screen w-full">
    {% include 'components/left_panel.html' %}
    
    <!-- Drag Resizer Handle -->
    <div id="sidebar-resizer" class="hidden md:block w-1.5 hover:w-2 bg-gray-200 dark:bg-gray-700 hover:bg-blue-500 cursor-col-resize transition-all shrink-0 z-30" title="Drag to resize panel"></div>

    {% include 'components/map_panel.html' %}
  </div>

  <div id="toast" class="fixed bottom-6 right-6 bg-gray-800 dark:bg-gray-700 text-white px-4 py-3 rounded shadow-xl transform transition-all duration-300 translate-y-20 opacity-0 z-50 flex items-center max-w-sm pointer-events-none">
    <span id="toast-message" class="text-sm break-words"></span>
  </div>

  <script type="module" src="static/app.js"></script>
  <!-- System Console Panel -->
    <div id="app-console" class="fixed bottom-0 left-0 md:left-80 lg:left-96 right-0 h-56 bg-gray-900 text-gray-300 z-[2000] border-t-2 border-gray-700 flex flex-col transform translate-y-full transition-transform duration-300 shadow-2xl">
        <div class="flex justify-between items-center bg-gray-800 px-4 py-1.5 border-b border-gray-700 shrink-0 select-none">
            <span class="text-xs font-bold font-mono text-gray-200"><i class="fa-solid fa-terminal mr-2 text-blue-400"></i>System Console</span>
            <div class="flex space-x-4 items-center">
                <button id="btn-clear-console" class="text-[10px] uppercase tracking-wider font-bold text-gray-400 hover:text-white transition-colors"><i class="fa-solid fa-ban mr-1"></i>Clear</button>
                <button id="btn-close-console" class="text-gray-400 hover:text-white transition-colors px-1"><i class="fa-solid fa-times"></i></button>
            </div>
        </div>
        <div id="console-output" class="flex-1 overflow-y-auto p-3 font-mono text-[11px] space-y-1 custom-scroll">
            <div class="text-gray-500 italic border-b border-gray-800 pb-1 mb-1">System initialized. Awaiting commands...</div>
        </div>
    </div>

</body>
</html>
